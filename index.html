<style>
  :root {
    --bg: #0f1117; --bg2: #161822; --card: #1c1f2e; --card-hover: #232640;
    --text: #e2e4eb; --text2: #c8cad3; --muted: #8b8fa3;
    --border: #2a2d3e; --border-light: #363a50;
    --accent: #7CB9E8; --accent2: #5ea3d4;
    --green: #81C784; --red: #E57373; --amber: #FFD54F; --blue: #7CB9E8; --gray: #90A4AE;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segö UI', Roboto, 'Inter', sans-serif;
         background: var(--bg); color: var(--text); line-height: 1.6;
         -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }

  /* Top area: header + filters + nav (static, no scroll) */
  .top-bar { flex-shrink: 0; max-width: 1100px; width: 100%; margin: 0 auto;
             padding: 12px 20px 0; }
  .header { padding: 16px 0 10px; text-align: center; }
  .header h1 { font-size: 1.8em; color: var(--text); margin-bottom: 4px;
               font-weight: 700; letter-spacing: -0.5px; }
  .header .subtitle { color: var(--muted); font-size: 0.95em; }

  /* Filter bar */
  .filter-bar {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 14px 18px; margin-bottom: 10px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  }
  .filter-bar h3 { font-size: 0.75em; color: var(--accent); text-transform: uppercase;
                    letter-spacing: 1px; margin-bottom: 10px; font-weight: 600; }
  .filter-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .filter-group { min-width: 180px; }
  .filter-group.wide { flex: 2; }
  .filter-group label { display: block; font-size: 0.78em; color: var(--muted);
                         margin-bottom: 4px; font-weight: 600; }
  .filter-group select { width: 100%; padding: 7px 10px; border: 1px solid var(--border-light);
                          border-radius: 6px; font-size: 0.88em; background: var(--bg2);
                          color: var(--text); transition: border-color 0.2s; }
  .filter-group select:focus { outline: none; border-color: var(--accent); }
  .filter-count { font-size: 0.85em; color: var(--accent); margin-top: 8px;
                   font-weight: 600; }
  .btn-reset { padding: 7px 16px; border: 1px solid var(--border-light); border-radius: 6px;
               background: var(--bg2); color: var(--text2); cursor: pointer; font-size: 0.85em;
               align-self: flex-end; transition: all 0.2s; }
  .btn-reset:hover { background: var(--border); color: var(--text); }

  /* Navigation */
  .nav { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
         padding: 10px 16px; margin-bottom: 0; display: flex; flex-wrap: wrap; gap: 4px; }
  .nav a { color: var(--muted); text-decoration: none; padding: 4px 12px; border-radius: 6px;
           font-size: 0.85em; font-weight: 500; white-space: nowrap; transition: all 0.2s;
           cursor: pointer; }
  .nav a:hover { color: var(--accent); background: var(--bg2); }

  /* Scroll container for content */
  .scroll-area { flex: 1; overflow-y: auto; max-width: 1100px; margin: 0 auto;}
  .scroll-inner { padding: 20px; }

  /* Chapters & cards */
  .chapter { margin-bottom: 36px; }
  .chapter-title { font-size: 1.4em; color: var(--text); font-weight: 700;
                   border-bottom: 2px solid var(--accent); border-image: linear-gradient(90deg, var(--accent), transparent) 1;
                   padding-bottom: 8px; margin-bottom: 18px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px;
          padding: 22px; margin-bottom: 14px; transition: border-color 0.2s; }
  .card:hover { border-color: var(--border-light); }
  .card-title { font-size: 1.1em; font-weight: 600; color: var(--text); margin-bottom: 4px; }
  .card-badge { font-size: 0.8em; color: var(--muted); margin-bottom: 14px;
                display: flex; align-items: center; gap: 8px; }
  .card-badge::before { content: ''; display: inline-block; width: 6px; height: 6px;
                         border-radius: 50%; background: var(--accent); }
  .chart-container { position: relative; max-width: 700px; }
  .chart-container.wide { max-width: 900px; }
  .chart-container.donut { max-width: 350px; }
  .small-n-warning { background: rgba(255,213,79,0.1); border: 1px solid rgba(255,213,79,0.3);
                      border-radius: 8px; padding: 8px 14px; font-size: 0.85em;
                      margin-bottom: 12px; color: var(--amber); }

  /* Freetext */
  .freetext-section { margin-top: 14px; }
  .freetext-section h4 { font-size: 0.95em; margin-bottom: 8px; color: var(--text2); }
  .quote { color: var(--text2); padding: 6px 0 6px 16px;
           border-left: 3px solid var(--border-light); margin-bottom: 8px; font-size: 0.9em;
           font-style: italic; }
  .sonstiges-list { margin-top: 12px; padding-left: 20px; }
  .sonstiges-list li { font-size: 0.9em; margin-bottom: 4px; color: var(--text2); }

  /* University map */
  .uni-map { width: 100%; height: 440px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 16px; }
  .uni-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 6px; margin-top: 4px; }
  .uni-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px;
              background: var(--bg2); border: 1px solid var(--border); border-radius: 6px;
              font-size: 0.85em; }
  .uni-count { display: inline-flex; align-items: center; justify-content: center;
               min-width: 22px; height: 22px; border-radius: 50%; background: var(--accent);
               color: var(--bg); font-weight: 700; font-size: 0.8em; flex-shrink: 0; }
  .uni-name { color: var(--text2); }
  .uni-unknown { opacity: 0.6; }
  .uni-section-title { font-size: 0.78em; color: var(--accent); text-transform: uppercase;
                       letter-spacing: 1px; font-weight: 600; margin: 12px 0 8px; }
  .uni-details { margin-top: 12px; }
  .uni-details summary { font-size: 0.78em; color: var(--accent); text-transform: uppercase;
                         letter-spacing: 1px; font-weight: 600; cursor: pointer;
                         list-style: none; display: flex; align-items: center; gap: 6px; }
  .uni-details summary::before { content: '▶'; font-size: 0.7em; transition: transform 0.2s; }
  .uni-details[open] summary::before { transform: rotate(90deg); }
  .uni-details summary::-webkit-details-marker { display: none; }

  /* Expandable 'weitere' in freetext */
  .weitere-details summary { font-size: 0.85em; color: var(--muted); cursor: pointer;
                              list-style: none; display: inline-flex; align-items: center; gap: 5px;
                              margin-top: 4px; }
  .weitere-details summary::before { content: '▶'; font-size: 0.7em; transition: transform 0.2s; }
  .weitere-details[open] summary::before { transform: rotate(90deg); }
  .weitere-details summary::-webkit-details-marker { display: none; }

  /* LLM analysis */
  .llm-section { margin-top: 16px; }
  .sentiment-badge { display: inline-block; padding: 3px 12px; border-radius: 20px;
                      color: var(--bg); font-size: 0.78em; font-weight: 700;
                      margin-bottom: 10px; letter-spacing: 0.5px; }
  .theme-item { margin-bottom: 6px; font-size: 0.9em; color: var(--text2); }
  .theme-item b { color: var(--accent); }

  /* Footer */
  .footer { text-align: center; padding: 36px; color: var(--muted); font-size: 0.82em;
            border-top: 1px solid var(--border); margin-top: 20px; }

  /* Highlight animation */
  @keyframes highlight-pulse {
    0%   { background-color: transparent; }
    15%  { background-color: rgba(124,185,232,0.35); }
    60%  { background-color: rgba(124,185,232,0.35); }
    100% { background-color: transparent; }
  }
  .highlight-flash { animation: highlight-pulse 1.7s ease-out; border-radius: 8px; }

  /* Scrollbar */
  .scroll-area::-webkit-scrollbar { width: 8px; }
  .scroll-area::-webkit-scrollbar-track { background: var(--bg); }
  .scroll-area::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }
  .scroll-area::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* Deckblatt-Metadaten (wie PDF-Titelseite) */
  .deckblatt-card {
    max-width: 720px; margin: 0 auto; padding: 14px 16px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    text-align: left; font-size: 0.88em; color: var(--text2);
  }
  .deckblatt-card .deck-rule {
    width: 34%; max-width: 140px; height: 2px; margin: 0 auto 10px; border-radius: 1px;
    background: var(--accent); opacity: 0.75;
  }
  .deckblatt-card .deck-inline { margin: 4px 0; color: var(--text2); line-height: 1.45; }
  .deckblatt-card .deck-inline-label { color: var(--muted); font-weight: 600; }
  .deckblatt-card .deck-sample { color: var(--text); }
  .deckblatt-card .deck-license {
    display: flex; align-items: center; justify-content: flex-start; gap: 10px; flex-wrap: nowrap;
    margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--border);
    text-align: left;
  }
  .deckblatt-card .deck-cc-badge { flex-shrink: 0; }
  .deckblatt-card .deck-license-text {
    font-size: 0.77em; color: var(--muted); max-width: none; margin: 0; line-height: 1.35;
  }
  .deckblatt-card a { color: var(--accent); }

  @media (max-width: 600px) {
    .filter-row { flex-direction: column; }
    .filter-group { min-width: 100%; }
    .nav { overflow-x: auto; white-space: nowrap; }
    .header h1 { font-size: 1.4em; }
    .top-bar { padding: 8px 12px 0; }
    .scroll-inner { padding: 12px; }
    .deckblatt-card .deck-license { flex-direction: column; text-align: center; }
    .deckblatt-card .deck-license-text { max-width: none; }
  }
</style>
</head>

let charts = {};
let currentRows = RAW_ROWS;

// --- Filter logic ---
function initFilters() {
  if (SHOW_UNI_FILTER) {
    const unis = [...new Set(RAW_ROWS.map(r => r.a).filter(v => v && v !== 'N/A'))].sort();
    fillSelect('filter-uni', unis);
    document.getElementById('filter-uni').addEventListener('change', applyFilters);
  }
}

function fillSelect(id, values) {
  const sel = document.getElementById(id);
  const isMulti = sel.multiple;
  values.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = v;
    sel.appendChild(opt);
  });
}

function getSelectedValues(id) {
  const sel = document.getElementById(id);
  if (sel.multiple) {
    return [...sel.selectedOptions].map(o => o.value).filter(v => v !== '');
  }
  return sel.value ? [sel.value] : [];
}

function applyFilters() {
  const unis = SHOW_UNI_FILTER ? getSelectedValues('filter-uni') : [];

  currentRows = RAW_ROWS.filter(r => {
    if (unis.length && (!r.a || !unis.includes(r.a))) return false;
    return true;
  });

  const fc1 = document.getElementById('filter-count');
  if (fc1) fc1.textContent = `${currentRows.length} von ${RAW_ROWS.length} Antworten ausgewaehlt`;
  renderAll();
}

function resetFilters() {
  if (SHOW_UNI_FILTER) {
    ['filter-uni'].forEach(id => {
      const sel = document.getElementById(id);
      if (sel.multiple) {
        [...sel.options].forEach(o => o.selected = o.value === '');
      } else {
        sel.value = '';
      }
    });
  }
  currentRows = RAW_ROWS;
  const fc2 = document.getElementById('filter-count');
  if (fc2) fc2.textContent = `${RAW_ROWS.length} Antworten (kein Filter)`;
  renderAll();
}

// --- Filtering helpers for groups ---
function getValidRows(rows, group) {
  // Exclude rows where all group columns are N/A or null
  let filtered = rows.filter(r => {
    const cols = group.options ? group.options.map(o => o.key) : [group.col_key];
    const allNA = cols.every(k => !r[k] || r[k] === 'N/A');
    return !allNA;
  });

  // Apply condition
  if (group.condition) {
    filtered = filtered.filter(r => {
      const val = r[group.condition.key];
      return val && group.condition.values.includes(val);
    });
  }
  return filtered;
}

// --- Chart rendering ---
function destroyChart(id) {
  if (charts[id]) { charts[id].destroy(); delete charts[id]; }
}

function renderCheckboxGroup(canvasId, group, rows) {
  destroyChart(canvasId);
  const validRows = getValidRows(rows, group);
  const n = validRows.length;

  const items = (group.options || []).map(opt => {
    const count = validRows.filter(r => r[opt.key] === 'Ja').length;
    return { label: opt.label, count };
  });

  // Sort: special keywords at bottom
  const special = ['Keine', 'Sonstiges', 'Weiß nicht'];
  const isSpecial = l => special.some(s => l.toLowerCase().includes(s.toLowerCase()));
  const regular = items.filter(i => !isSpecial(i.label)).sort((a,b) => b.count - a.count);
  const specials_ = items.filter(i => isSpecial(i.label)).sort((a,b) => b.count - a.count);
  const sorted = [...regular, ...specials_];

  const canvas = document.getElementById(canvasId);
  if (!canvas) return;

  // Update badge
  const badge = document.getElementById(canvasId + '-badge');
  if (badge) {
    badge.textContent = `Mehrfachauswahl | ${n} Befragte`;
  }
  const warn = document.getElementById(canvasId + '-warn');
  if (warn) warn.style.display = n < 10 ? 'block' : 'none';

  charts[canvasId] = new Chart(canvas, {
    type: 'bar',
    data: {
      labels: sorted.map(i => i.label),
      datasets: [{
        data: sorted.map(i => i.count),
        backgroundColor: PALETTE[0],
        borderRadius: 3,
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => {
              const pct = n > 0 ? (ctx.raw / n * 100).toFixed(0) : 0;
              return `${ctx.raw} (${pct}%)`;
            }
          }
        }
      },
      scales: {
        x: { beginAtZero: true, title: { display: true, text: 'Anzahl Antworten' },
             ticks: { precision: 0 }, grid: { color: '#2a2d3e' } },
        y: { ticks: { font: { size: 11 } }, grid: { display: false } }
      }
    }
  });
}

function renderBinaryExtended(canvasId, group, rows) {

  const labels = Object.keys(counts);

    options: {

      plugins: {
        legend: { position: 'bottom', labels: { font: { size: 12 }, padding: 12 } },
        tooltip: {
          callbacks: {
            label: ctx => {
              const total = ctx.dataset.data.reduce((a,b) => a+b, 0);
              const pct = total > 0 ? (ctx.raw / total * 100).toFixed(1) : 0;
              return `${ctx.label}: ${ctx.raw} (${pct}%)`;
            }
          }
        }
      }
    }
  });
}

function renderCategorical(canvasId, group, rows) {
  destroyChart(canvasId);
  const validRows = getValidRows(rows, group);
  const values = validRows.map(r => r[group.col_key]).filter(v => v && v !== 'N/A');
  const counts = {};
  values.forEach(v => { counts[v] = (counts[v] || 0) + 1; });

  let items = Object.entries(counts).sort((a,b) => b[1] - a[1]);

  // Group rare if >20
  if (items.length > 20) {
    const top = items.slice(0, 19);
    const rest = items.slice(19);
    const restSum = rest.reduce((a, b) => a + b[1], 0);
    top.push([`Sonstige (${rest.length})`, restSum]);
    items = top;
  }

  const badge = document.getElementById(canvasId + '-badge');
  if (badge) badge.textContent = `Kategorisch | ${values.length} Befragte`;

  const canvas = document.getElementById(canvasId);
  if (!canvas) return;

  charts[canvasId] = new Chart(canvas, {
    type: 'bar',
    data: {
      labels: items.map(i => i[0].length > 50 ? i[0].slice(0,47)+'...' : i[0]),
      datasets: [{
        data: items.map(i => i[1]),
        backgroundColor: items.map((_, i) => PALETTE[i % PALETTE.length]),
        borderRadius: 3,
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: { callbacks: { label: ctx => `${ctx.raw} Antworten` } }
      },
      scales: {
        x: { beginAtZero: true, ticks: { precision: 0 }, grid: { color: '#2a2d3e' } },
        y: { ticks: { font: { size: 11 } }, grid: { display: false } }
      }
    }
  });
}

let _uniMap = null;

function renderUniversityMap(canvasId, group, rows) {
  const validRows = getValidRows(rows, group);
  const values = validRows.map(r => r[group.col_key]).filter(v => v && v !== "N/A");
  const counts = {};
  values.forEach(v => { counts[v] = (counts[v] || 0) + 1; });
  const items = Object.entries(counts).sort((a, b) => b[1] - a[1]);

  const badge = document.getElementById(canvasId + "-badge");
  if (badge) badge.textContent = `Karte | ${values.length} Befragte | ${items.length} Hochschulen`;

  // --- Leaflet map ---
  const mapEl = document.getElementById(canvasId + "-map");
    if (mapEl) {
    if (_uniMap) { _uniMap.remove(); _uniMap = null; }
    _uniMap = L.map(mapEl).setView([51.0, 10.8], 5);
    // Browser-HTML wird oft per file:// geöffnet; OSM blockiert dann wegen fehlendem Referer.
    // Daher KEIN OSM-Layer im Browser, sondern Carto light -> OpenTopoMap -> ruhiger Fallback.
    const _tileTopo = L.tileLayer("https://tile.opentopomap.org/{z}/{x}/{y}.png", {
      attribution: "© OpenStreetMap contributors, SRTM | Kartendarstellung: OpenTopoMap",
      maxZoom: 17
    });
    const _tileCartoLight = L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
      subdomains: "abcd",
      attribution: "© OpenStreetMap © CARTO",
      maxZoom: 19
    });
    _tileCartoLight.addTo(_uniMap);
    let _cartoErr = 0;
    _tileCartoLight.on("tileerror", () => {
      if (++_cartoErr < 3 || _uniMap._fallbackTiles) return;
      _uniMap._fallbackTiles = true;
      _uniMap.removeLayer(_tileCartoLight);
      _tileTopo.addTo(_uniMap);
      let _topoErr = 0;
      _tileTopo.on("tileerror", () => {
        if (++_topoErr < 3 || _uniMap._fallbackTiles2) return;
        _uniMap._fallbackTiles2 = true;
        _uniMap.removeLayer(_tileTopo);
        mapEl.style.background = "#d9dde6";
      });
    });

    const bounds = L.latLngBounds();
    items.forEach(([name, count]) => {
      const coords = UNI_COORDS[name];
      if (!coords) return;
      bounds.extend(coords);
      L.circleMarker(coords, {
        radius: 10,
        fillColor: "#7CB9E8",
        color: "#5ea3d4",
        weight: 1.5,
        opacity: 0.9,
        fillOpacity: 0.65
      }).addTo(_uniMap).bindPopup(`<strong>${name}</strong>`);
    });
    if (bounds.isValid()) {
      _uniMap.fitBounds(bounds, {
        paddingTopLeft: [20, 36],
        paddingBottomRight: [52, 36],
        maxZoom: 7,
      });
    }
  }

  // --- Full list ---
  const listEl = document.getElementById(canvasId + "-list");
  if (!listEl) return;

  const known = items.filter(([n]) => UNI_COORDS[n]);
  const unknown = items.filter(([n]) => !UNI_COORDS[n]);

  let h = `<details class="uni-details"><summary>Alle Hochschulen (${items.length})</summary>`;
  h += "<div class='uni-list'>";
  known.forEach(([name, count]) => {
    h += `<div class="uni-item"><span class="uni-count">${count}</span><span class="uni-name">${esc(name)}</span></div>`;
  });
  unknown.forEach(([name, count]) => {
    h += `<div class="uni-item uni-unknown"><span class="uni-count">${count}</span><span class="uni-name">${esc(name)}</span></div>`;
  });
  h += "</div></details>";
  listEl.innerHTML = h;
}

function renderFreetext(containerId, group, rows) {
  const el = document.getElementById(containerId);
  if (!el) return;
  // Freetext answers are pre-computed and static (LLM results don't change with filters)
  // But we can show which answers match the current filter
  if (!group.answers || group.answers.length === 0) {
    el.innerHTML = '<p style="color:var(--muted)">Keine Antworten vorhanden.</p>';
    return;
  }

  // For freetext, show filtered answers based on row indices
  // Since answers are pre-extracted, we show them all but update count
  const validRows = getValidRows(rows, group);
  const badge = document.getElementById(containerId + '-badge');
  if (badge) badge.textContent = `Freitext | ${group.answers.length} Antworten gesamt`;

  // LLM result is static
  const llm = LLM_RESULTS[group.key];
  let h = '';
  if (llm) {
    const sc = SENTIMENT_COLORS[llm.sentiment] || SENTIMENT_COLORS['unbekannt'];
    h += `<div class="llm-section">`;
    h += `<span class="sentiment-badge" style="background:${sc}">${(llm.sentiment||'').toUpperCase()}</span>`;
    if (llm.zusammenfassung) {
      h += `<h4>Zusammenfassung</h4><p style="font-size:0.9em">${esc(llm.zusammenfassung)}</p>`;
    }
    if (llm.hauptthemen && llm.hauptthemen.length) {
      h += '<h4>Hauptthemen</h4>';
      llm.hauptthemen.forEach(t => {
        if (typeof t === 'object') {
          h += `<div class="theme-item"><b>${esc(t.thema||'')}</b>: ${esc(t.erklaerung||'')}</div>`;
        } else {
          h += `<div class="theme-item">${esc(String(t))}</div>`;
        }
      });
    }
    if (llm.interessante_quotes && llm.interessante_quotes.length) {
      h += '<h4 style="margin-top:10px">Ausgewaehlte Zitate</h4>';
      llm.interessante_quotes.forEach(q => {
        h += `<div class="quote">&ldquo;${esc(q)}&rdquo;</div>`;
      });
    }
    if (llm.auffaelligkeiten) {
      h += `<p style="font-size:0.85em;color:var(--muted);margin-top:8px"><em>Auffaelligkeiten: ${esc(llm.auffaelligkeiten)}</em></p>`;
    }
    h += '</div>';
  } else {
    // Show first 5 answers, collapse the rest
    const show = group.answers.slice(0, 5);
    show.forEach(a => { h += `<div class="quote">&ldquo;${esc(a)}&rdquo;</div>`; });
    if (group.answers.length > 5) {
      const rest = group.answers.slice(5);
      h += `<details class="weitere-details"><summary>... und ${rest.length} weitere</summary>`;
      rest.forEach(a => { h += `<div class="quote">&ldquo;${esc(a)}&rdquo;</div>`; });
      h += `</details>`;
    }
  }
  el.innerHTML = h;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// --- Build DOM ---
function buildContent() {
  const nav = document.getElementById('nav');
  const content = document.getElementById('content');
  const deckblattTemplate = document.getElementById('deckblatt-template');

  let navHtml = '<a data-target="ch-Ueberblick">Überblick</a> ';
  CHAPTERS.forEach(ch => {
    const id = 'ch-' + ch.replace(/[^a-zA-Z0-9]/g, '_');
    navHtml += `<a data-target="${id}">${ch}</a> `;
  });
  nav.innerHTML = navHtml;

  // Click handler: scroll within scroll-area
  const scrollArea = document.getElementById('scroll-area');
  nav.querySelectorAll('a[data-target]').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const target = document.getElementById(a.dataset.target);
      if (target && scrollArea) {
        scrollArea.scrollTo({ top: target.offsetTop - scrollArea.offsetTop, behavior: 'smooth' });
        target.querySelectorAll('.card').forEach(card => {
          card.classList.remove('highlight-flash');
          void card.offsetWidth;
          card.classList.add('highlight-flash');
        });
      }
    });
  });

  let html = '';
  const deckblattHtml = deckblattTemplate ? deckblattTemplate.innerHTML.trim() : '';
  html += '<div class="chapter" id="ch-Ueberblick">';
  html += '<h2 class="chapter-title">Überblick</h2>';
  html += '<div class="card">';
  html += deckblattHtml ? `<div class="deckblatt-card">${deckblattHtml}</div>` : '';
  html += '</div></div>';
  let currentChapter = '';

  GROUPS.forEach(g => {
    if (g.chapter && g.chapter !== currentChapter) {
      if (currentChapter) html += '</div>';
      currentChapter = g.chapter;
      const chId = 'ch-' + g.chapter.replace(/[^a-zA-Z0-9]/g, '_');
      html += `<div class="chapter" id="${chId}">`;
      html += `<h2 class="chapter-title">${esc(g.chapter)}</h2>`;
    }

    const cid = 'chart-' + g.key;

    html += '<div class="card">';
    html += `<div class="card-title">${esc(g.title)}</div>`;
    html += `<div class="card-badge" id="${cid}-badge"></div>`;

    if (g.type === 'checkbox_group') {
      html += `<div id="${cid}-warn" class="small-n-warning" style="display:none">Achtung: geringe Fallzahl (&lt;10 Befragte)</div>`;
      const nOpts = (g.options||[]).length;
      const h = Math.max(200, nOpts * 32 + 60);
      html += `<div class="chart-container wide" style="height:${h}px"><canvas id="${cid}"></canvas></div>`;
      if (g.sonstiges_texts && g.sonstiges_texts.length) {
        const n = g.sonstiges_texts.length;
        html += `<div style="margin-top:16px">`;
        html += `<div class="card-badge" style="margin-bottom:8px">Freitext | ${n} Antworten gesamt</div>`;
        const show = g.sonstiges_texts.slice(0, 5);
        show.forEach(t => { html += `<div class="quote">${esc(t)}</div>`; });
        if (n > 5) {
          const rest = g.sonstiges_texts.slice(5);
          html += `<details class="weitere-details"><summary>... und ${rest.length} weitere</summary>`;
          rest.forEach(t => { html += `<div class="quote">${esc(t)}</div>`; });
          html += `</details>`;
        }
        html += '</div>';
      }
    } else if (g.type === 'binary_extended') {
      html += `<div class="chart-container donut" style="height:280px"><canvas id="${cid}"></canvas></div>`;
    } else if (g.type === 'categorical') {
      html += `<div class="chart-container wide" style="height:500px"><canvas id="${cid}"></canvas></div>`;
    } else if (g.type === 'university_map') {
      html += `<div id="${cid}-map" class="uni-map"></div>`;
      html += `<div id="${cid}-list"></div>`;
    } else if (g.type === 'freetext_llm') {
      html += `<div class="freetext-section" id="${cid}"></div>`;
    }

    html += '</div>';
  });

  if (currentChapter) html += '</div>';
  content.innerHTML = html;
}

// --- Render all charts ---
function renderAll() {
  GROUPS.forEach(g => {
    const cid = 'chart-' + g.key;
    if (g.type === 'checkbox_group') renderCheckboxGroup(cid, g, currentRows);
    else if (g.type === 'binary_extended') renderBinaryExtended(cid, g, currentRows);
    else if (g.type === 'categorical') renderCategorical(cid, g, currentRows);
    else if (g.type === 'university_map') renderUniversityMap(cid, g, currentRows);
    else if (g.type === 'freetext_llm') renderFreetext(cid, g, currentRows);
  });
}
